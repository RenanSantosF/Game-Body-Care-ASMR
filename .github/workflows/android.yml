name: Build Android (APK + AAB)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Godot 4.7.2: bibliotecas Android alinhadas em 16 KB (exigência da Google Play
  # para Android 15+) e alvo API 36.
  GODOT_VERSION: "4.7.2"
  GODOT_SETTINGS: "4.7"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (build-tools, API 36, NDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;36.1.0" "platforms;android-36" "ndk;29.0.14206865" > /dev/null

      - name: Compilar o plugin Android (gg_native) contra o Godot ${{ env.GODOT_VERSION }}
        run: |
          set -e
          cd plugin_src
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp build/outputs/aar/gg_native-release.aar ../addons/gg_native/bin/gg_native-release.aar
          ls -la ../addons/gg_native/bin

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-gradle-v2

      - name: Baixar Godot e templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q -j tpl.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/android_source.zip" "templates/version.txt" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm tpl.tpz

      - name: Modelo de build Android (Gradle) + ajustes da Play Console
        run: |
          set -e
          rm -rf android
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          touch android/build/.gdignore
          printf "%s.stable" "$GODOT_VERSION" > android/.build_version
          # APIs de ponta a ponta descontinuadas no Android 15 (aviso da Play Console)
          bash ci/android_play_compat.sh android/build

      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/keys
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/keys/debug.keystore
          else
            keytool -genkeypair -v -keystore ~/keys/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configurar editor
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_SETTINGS}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/keys/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Importar e exportar APK de teste (anúncios de teste)
        run: |
          mkdir -p build
          ~/godot/godot --headless --editor --quit --path . || true
          ~/godot/godot --headless --path . --export-debug "Android" build/GrossToGlow.apk
          ls -la build

      # AAB de publicação: cadastre nos segredos do repositório UPLOAD_KEYSTORE_B64 (base64 do .jks)
      # e UPLOAD_KEYSTORE_PASSWORD. Sem eles, este passo é pulado.
      - name: Exportar AAB para a Play Store
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        if: env.UPLOAD_KEYSTORE_B64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > ~/keys/upload.jks
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/keys/upload.jks
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=upload
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$UPLOAD_KEYSTORE_PASSWORD"
          ~/godot/godot --headless --path . --export-release "Android AAB" build/GrossToGlow.aab
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: GrossToGlow-apk
          path: build/GrossToGlow.apk

      - uses: actions/upload-artifact@v4
        if: hashFiles('build/GrossToGlow.aab') != ''
        with:
          name: GrossToGlow-aab
          path: build/GrossToGlow.aab

      - name: Publicar release (tags v* ou execução manual)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Gross to Glow - build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          body: |
            GrossToGlow.apk: APK de teste (instala direto no celular).
            GrossToGlow.aab: pacote assinado para enviar à Google Play Console.
          files: |
            build/GrossToGlow.apk
            build/GrossToGlow.aab
